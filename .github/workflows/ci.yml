name: tests
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install lightweight runtime and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-demo.txt pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Train pipeline (no external services)
        run: python -m src.pipeline.run --no-mlflow
